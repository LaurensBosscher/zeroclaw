name: Fork build

# Builds the all-features image from this fork and publishes it to GHCR.
# Upstream docker-publish is limited to zeroclaw-labs/zeroclaw, so the homelab
# image build needs this tag. This workflow lives only on the fork branch
# ci/homelab-image and is not part of the upstream pull request.

on:
  workflow_dispatch:
  push:
    branches:
      - ci/homelab-image

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/laurensbosscher/zeroclaw

jobs:
  build:
    name: Build all-features image
    if: github.repository == 'LaurensBosscher/zeroclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      # Saving the Cargo cache uses the Actions cache.
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # COPY and ZEROCLAW_BUILD_ID change on every push, so an image-layer
      # cache never reuses the compile. These mounts are the registry and the
      # release target directory. A restored target directory lets Cargo skip
      # crates that did not change. The exact key includes the commit so each
      # build saves a new snapshot; restore-keys pick up the previous one.
      # A cache larger than the Actions limit must not fail the image push.
      - name: Restore Cargo build cache
        continue-on-error: true
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            cargo-registry
            cargo-git
            cargo-target
            web-target
          key: fork-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            fork-cargo-${{ hashFiles('Cargo.lock') }}-
            fork-cargo-

      - name: Prepare Cargo cache directories
        run: mkdir -p cargo-registry cargo-git cargo-target web-target

      - name: Inject Cargo cache into BuildKit
        continue-on-error: true
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "cargo-registry": "/root/.cargo/registry",
              "cargo-git": "/root/.cargo/git",
              "cargo-target": "/target",
              "web-target": { "target": "/src/target", "id": "web-target" }
            }
          skip-extraction: false

      - name: Build and push
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.18.0
        with:
          context: .
          file: Containerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: |
            ZEROCLAW_BUILD_ID=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:pr-11862
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Make the package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A private package cannot be pulled by the homelab. Visibility
          # changes need a token that owns the package; ignore a refusal so a
          # public package (or a later manual flip) still leaves the image pushed.
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/zeroclaw" \
            -f visibility=public || true
